name: Feature request
description: Suggest something the library should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work, from your app's or the agent's side.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
